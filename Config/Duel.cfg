# Duel service (Scripts/Services/Dueling)

# Port for the read-only JSON feed of live matches, standings and recent history,
# served at http://<host>:<port>/duel/ (the Tavern's /duels page reads it).
# 0 disables the feed.
# Default: 8095
WebPort=8095

# Address the feed binds to: * for every interface, 127.0.0.1 when a reverse
# proxy (Caddy on the arena host) serves it over HTTPS.
# Default: *
WebHost=*
