# Enable on a dedicated arena shard. Joining sets arena skills/stats permanently.
Enabled=false
# Participants run agents on their own machines; pair ordinary accounts.
PeerAgents=true
# Disable the unrelated ocean spawner on dedicated arena deployments.
DisableRisingTide=false
WelcomeOnLogin=false
Domain=arena.uotavern.com
# Comma-separated ACCOUNT usernames, never character display names. Keep these accounts at Player access.
BotAccounts=
# Pair training workers while the human queue is empty. Public workers remain available for humans.
SelfPlay=false
